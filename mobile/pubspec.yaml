name: cohabio
description: "Cohabio - AI Relocation & Community Platform for Students & Young Professionals"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  google_fonts: ^6.1.0
  http: ^1.2.0
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  cached_network_image: ^3.3.1
  dio: ^5.4.1
  flutter_secure_storage: ^9.0.0
  lottie: ^3.1.0
  image_picker: ^1.0.7
  google_maps_flutter: ^2.5.3
  responsive_framework: ^1.1.1
  flutter_hooks: ^0.20.5
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
